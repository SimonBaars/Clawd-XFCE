[project]
name = "clippy-xfce"
version = "1.0.0"
description = "Native XFCE Clippy assistant powered by Claude Computer Use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clippy XFCE" }]
dependencies = [
    "anthropic>=0.69.0",
    "python-xlib>=0.33",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clippy = "clippy_xfce.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clippy_xfce = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
